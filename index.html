<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HAVOC STYX — Tier List</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #07090d;
  color: white;
}

header {
  padding: 35px 20px;
  text-align: center;
  background: linear-gradient(135deg, #111722, #080a0f);
  border-bottom: 1px solid #293140;
}

.logo {
  font-size: 32px;
  font-weight: 900;
  letter-spacing: 2px;
}

.subtitle {
  margin-top: 8px;
  color: #8993a5;
  font-size: 13px;
}

.container {
  width: min(1050px, 100%);
  margin: auto;
  padding: 22px;
}

.toolbar {
  display: grid;
  grid-template-columns: 1fr 230px;
  gap: 12px;
  margin-bottom: 22px;
}

input,
select {
  width: 100%;
  padding: 14px;
  border-radius: 11px;
  border: 1px solid #293241;
  background: #11151d;
  color: white;
  font-size: 15px;
  outline: none;
}

input:focus,
select:focus {
  border-color: #6674ff;
}

.section-title {
  margin-bottom: 12px;
  color: #8c97a8;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 1px;
  text-transform: uppercase;
}

.tier {
  display: grid;
  grid-template-columns: 80px 1fr;
  margin-bottom: 8px;
  background: #11151d;
  border: 1px solid #252d3a;
  border-radius: 11px;
  overflow: hidden;
}

.tier-name {
  display: flex;
  justify-content: center;
  align-items: center;
  background: #181e28;
  font-size: 17px;
  font-weight: 900;
}

.players {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 12px;
  min-height: 55px;
}

.player {
  padding: 9px 13px;
  border-radius: 8px;
  border: 1px solid #303a4b;
  background: #1b222d;
  color: white;
  font-weight: 700;
  cursor: pointer;
  transition: .15s;
}

.player:hover {
  background: #2b3546;
  transform: translateY(-1px);
}

.empty {
  padding: 8px;
  color: #687385;
}

/* PROFILE */

.profile {
  display: none;
  margin-top: 25px;
  border: 1px solid #2b3545;
  border-radius: 17px;
  overflow: hidden;
  background: #0d1118;
}

.profile.active {
  display: block;
}

.profile-banner {
  padding: 28px 24px;
  background: linear-gradient(135deg, #171f2e, #0d1118);
  border-bottom: 1px solid #293241;
}

.profile-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
}

.profile-name {
  font-size: 30px;
  font-weight: 900;
}

.profile-label {
  margin-top: 5px;
  color: #7f8999;
  font-size: 11px;
  letter-spacing: 1px;
}

.close {
  padding: 9px 14px;
  border: 1px solid #303a49;
  border-radius: 8px;
  background: #1a202b;
  color: white;
  cursor: pointer;
}

.profile-body {
  padding: 20px;
}

.kit-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}

.kit-card {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px;
  background: #141a23;
  border: 1px solid #283240;
  border-radius: 11px;
}

.kit-name {
  font-weight: 700;
}

.rank {
  padding: 6px 10px;
  border-radius: 7px;
  background: #252f3e;
  font-weight: 900;
}

.unranked {
  color: #6d7788;
  font-weight: 600;
}

.status {
  margin-top: 20px;
  text-align: center;
  color: #7e899a;
  font-size: 13px;
}

.error {
  color: #ff6d6d;
}

@media (max-width: 700px) {
  .toolbar {
    grid-template-columns: 1fr;
  }

  .kit-grid {
    grid-template-columns: 1fr;
  }

  .profile-name {
    font-size: 25px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">HAVOC STYX</div>
  <div class="subtitle">FFA • OFFICIAL PLAYER TIER LIST</div>
</header>

<div class="container">

  <div class="toolbar">

    <input
      id="search"
      type="text"
      placeholder="Search player..."
      autocomplete="off"
    >

    <select id="kitSelect">
      <option value="">Loading kits...</option>
    </select>

  </div>

  <div class="section-title">
    Tier List
  </div>

  <div id="tierList"></div>

  <div id="profile" class="profile">

    <div class="profile-banner">

      <div class="profile-title">

        <div>
          <div id="profileName" class="profile-name"></div>

          <div class="profile-label">
            HAVOC STYX PLAYER PROFILE
          </div>
        </div>

        <button
          class="close"
          onclick="closeProfile()"
        >
          Close
        </button>

      </div>

    </div>

    <div class="profile-body">

      <div id="kitGrid" class="kit-grid"></div>

    </div>

  </div>

  <div id="status" class="status">
    Connecting to HAVOC STYX...
  </div>

</div>

<script>

/* =====================================
   HAVOC STYX API
===================================== */

const API_URL =
  "https://havoc-bot-production-82b2.up.railway.app";


/* =====================================
   TIERS
===================================== */

const TIERS = [
  "HT1",
  "LT1",
  "HT2",
  "LT2",
  "HT3",
  "LT3",
  "HT4",
  "LT4",
  "HT5",
  "LT5"
];


let tierData = null;


/* =====================================
   LOAD API
===================================== */

async function loadData() {

  const status =
    document.getElementById("status");

  try {

    status.textContent =
      "Connecting to HAVOC STYX...";

    const response = await fetch(
      API_URL +
      "/api/tiers?time=" +
      Date.now(),
      {
        method: "GET",
        cache: "no-store"
      }
    );

    if (!response.ok) {
      throw new Error(
        "HTTP " + response.status
      );
    }

    const result =
      await response.json();

    if (
      !result ||
      !Array.isArray(result.kits) ||
      !Array.isArray(result.tiers) ||
      !result.data
    ) {
      throw new Error(
        "Invalid API response"
      );
    }

    tierData = result;

    createKitSelector();

    renderTierList();

    status.textContent =
      "🟢 Live • Auto-updating";

    status.classList.remove("error");

  } catch (error) {

    console.error(
      "HAVOC STYX API ERROR:",
      error
    );

    status.textContent =
      "🔴 API connection failed";

    status.classList.add("error");
  }
}


/* =====================================
   KIT DROPDOWN
===================================== */

function createKitSelector() {

  const select =
    document.getElementById(
      "kitSelect"
    );

  const previous =
    select.value;

  select.innerHTML = "";

  tierData.kits.forEach(kit => {

    const option =
      document.createElement(
        "option"
      );

    option.value =
      kit.id;

    option.textContent =
      kit.name;

    select.appendChild(
      option
    );

  });

  if (
    previous &&
    tierData.kits.some(
      kit => kit.id === previous
    )
  ) {

    select.value =
      previous;

  }

}


/* =====================================
   RENDER TIER LIST
===================================== */

function renderTierList() {

  if (!tierData) return;

  const select =
    document.getElementById(
      "kitSelect"
    );

  const kit =
    select.value;

  const search =
    document.getElementById(
      "search"
    ).value
      .trim()
      .toLowerCase();

  const players =
    tierData.data[kit] || {};

  const container =
    document.getElementById(
      "tierList"
    );

  container.innerHTML = "";

  TIERS.forEach(tier => {

    const row =
      document.createElement(
        "div"
      );

    row.className =
      "tier";

    const label =
      document.createElement(
        "div"
      );

    label.className =
      "tier-name";

    label.textContent =
      tier;

    const playersBox =
      document.createElement(
        "div"
      );

    playersBox.className =
      "players";

    const names =
      Object.entries(players)
        .filter(([name, rank]) => {

          return (
            rank === tier &&
            (
              !search ||
              name
                .toLowerCase()
                .includes(search)
            )
          );

        })
        .map(([name]) => name);

    if (names.length === 0) {

      const empty =
        document.createElement(
          "div"
        );

      empty.className =
        "empty";

      empty.textContent =
        "No players";

      playersBox.appendChild(
        empty
      );

    } else {

      names.forEach(name => {

        const player =
          document.createElement(
            "div"
          );

        player.className =
          "player";

        player.textContent =
          name;

        player.onclick =
          () => showProfile(name);

        playersBox.appendChild(
          player
        );

      });

    }

    row.appendChild(label);

    row.appendChild(
      playersBox
    );

    container.appendChild(
      row
    );

  });
}


/* =====================================
   PLAYER PROFILE
===================================== */

function showProfile(
  playerName
) {

  if (!tierData) return;

  const profile =
    document.getElementById(
      "profile"
    );

  const name =
    document.getElementById(
      "profileName"
    );

  const grid =
    document.getElementById(
      "kitGrid"
    );

  name.textContent =
    playerName;

  grid.innerHTML = "";

  tierData.kits.forEach(kit => {

    const rank =
      tierData.data[
        kit.id
      ]?.[playerName];

    const card =
      document.createElement(
        "div"
      );

    card.className =
      "kit-card";

    const kitName =
      document.createElement(
        "div"
      );

    kitName.className =
      "kit-name";

    kitName.textContent =
      kit.name;

    const rankElement =
      document.createElement(
        "div"
      );

    rankElement.className =
      "rank";

    if (rank) {

      rankElement.textContent =
        rank;

    } else {

      rankElement.textContent =
        "Unranked";

      rankElement.classList.add(
        "unranked"
      );

    }

    card.appendChild(
      kitName
    );

    card.appendChild(
      rankElement
    );

    grid.appendChild(
      card
    );

  });

  profile.classList.add(
    "active"
  );

  profile.scrollIntoView({
    behavior: "smooth",
    block: "start"
  });

}


/* =====================================
   CLOSE PROFILE
===================================== */

function closeProfile() {

  document
    .getElementById("profile")
    .classList.remove(
      "active"
    );

}


/* =====================================
   SEARCH
===================================== */

document
  .getElementById("search")
  .addEventListener(
    "input",
    renderTierList
  );


/* =====================================
   KIT CHANGE
===================================== */

document
  .getElementById("kitSelect")
  .addEventListener(
    "change",
    renderTierList
  );


/* =====================================
   START
===================================== */

loadData();


/* =====================================
   AUTO UPDATE EVERY 10 SECONDS
===================================== */

setInterval(
  loadData,
  10000
);

</script>

</body>
  </html>
