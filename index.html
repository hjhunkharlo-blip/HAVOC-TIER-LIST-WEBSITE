<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>HAVOC STYX FFA Tier List</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #080a0f;
      color: white;
    }

    header {
      text-align: center;
      padding: 35px 15px;
      background: #0e1118;
      border-bottom: 1px solid #252a35;
    }

    h1 {
      margin: 0;
      font-size: 30px;
    }

    header p {
      color: #8e96a5;
      margin-top: 8px;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 20px;
    }

    .search,
    .kit-select {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #303644;
      background: #11151d;
      color: white;
      font-size: 16px;
      margin-bottom: 15px;
      outline: none;
    }

    .tier {
      display: grid;
      grid-template-columns: 90px 1fr;
      margin-bottom: 8px;
      background: #11151d;
      border: 1px solid #252a35;
      border-radius: 10px;
      overflow: hidden;
    }

    .tier-name {
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      font-size: 18px;
      background: #171c26;
      padding: 18px 5px;
    }

    .players {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 12px;
    }

    .player {
      background: #202632;
      border-radius: 8px;
      padding: 9px 12px;
      cursor: pointer;
    }

    .player:hover {
      background: #30394a;
    }

    .profile {
      display: none;
      margin-top: 25px;
      background: #0f131b;
      border: 1px solid #2a303d;
      border-radius: 14px;
      padding: 22px;
    }

    .profile.active {
      display: block;
    }

    .profile-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .profile-name {
      font-size: 27px;
      font-weight: bold;
    }

    .close {
      border: 0;
      background: #252b37;
      color: white;
      padding: 9px 14px;
      border-radius: 8px;
      cursor: pointer;
    }

    .rank-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #171c25;
      border: 1px solid #252b36;
      padding: 14px;
      border-radius: 10px;
      margin-bottom: 8px;
    }

    .rank {
      font-weight: bold;
      background: #252d3b;
      padding: 6px 10px;
      border-radius: 7px;
    }

    .unranked {
      color: #737c8c;
    }

    .status {
      text-align: center;
      color: #7f8795;
      font-size: 13px;
      margin-top: 20px;
    }

  </style>
</head>

<body>

<header>

  <h1>
    HAVOC STYX FFA TIER LIST
  </h1>

  <p>
    Official HAVOC STYX player rankings
  </p>

</header>

<div class="container">

  <input
    id="search"
    class="search"
    type="text"
    placeholder="Search player..."
  >

  <select
    id="kitSelect"
    class="kit-select"
  ></select>

  <div id="tierList"></div>

  <div
    id="profile"
    class="profile"
  >

    <div class="profile-header">

      <div
        id="profileName"
        class="profile-name"
      ></div>

      <button
        class="close"
        onclick="closeProfile()"
      >
        Close
      </button>

    </div>

    <div id="profileRanks"></div>

  </div>

  <div
    id="status"
    class="status"
  >
    Loading...
  </div>

</div>

      Date.now()
    );

      throw new Error(
        "API returned " + response.status
      );
    }

    tierData = await response.json();

    renderTierList();

    document.getElementById(
      "status"
    ).textContent =
      "🟢 Live • Updates automatically";

  } catch (error) {

    console.error(error);

    document.getElementById(
      "status"
    ).textContent =
      "🔴 Unable to connect to HAVOC STYX API";

  }

}
