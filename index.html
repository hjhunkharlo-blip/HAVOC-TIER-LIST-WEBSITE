<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>HAVOC STYX FFA Tier List</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #080a0f;
      color: white;
    }

    header {
      text-align: center;
      padding: 35px 15px;
      background: #0e1118;
      border-bottom: 1px solid #252a35;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
    }

    header p {
      color: #8e96a5;
      margin-top: 8px;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 20px;
    }

    .search {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #303644;
      background: #11151d;
      color: white;
      font-size: 16px;
      outline: none;
      margin-bottom: 15px;
    }

    .kit-select {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #303644;
      background: #11151d;
      color: white;
      font-size: 16px;
      margin-bottom: 20px;
    }

    .tier {
      display: grid;
      grid-template-columns: 90px 1fr;
      margin-bottom: 8px;
      background: #11151d;
      border: 1px solid #252a35;
      border-radius: 10px;
      overflow: hidden;
    }

    .tier-name {
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 18px;
      background: #171c26;
      padding: 18px 5px;
    }

    .players {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 12px;
    }

    .player {
      background: #202632;
      border-radius: 8px;
      padding: 9px 12px;
      cursor: pointer;
      transition: 0.15s;
    }

    .player:hover {
      background: #30394a;
      transform: translateY(-1px);
    }

    .profile {
      display: none;
      background: #0f131b;
      border: 1px solid #2a303d;
      border-radius: 14px;
      padding: 22px;
      margin-top: 20px;
    }

      display: block;
    }
