<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>HAVOC STYX FFA Tier List</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #080a0f;
      color: #ffffff;
    }

    header {
      padding: 35px 20px;
      text-align: center;
      background: #0e1118;
      border-bottom: 1px solid #252a35;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
      font-weight: 800;
    }

    header p {
      margin: 8px 0 0;
      color: #8f98a8;
    }

    .container {
      width: 100%;
      max-width: 1000px;
      margin: auto;
      padding: 20px;
    }

    input,
    select {
      width: 100%;
      padding: 14px;
      margin-bottom: 14px;
      border: 1px solid #303744;
      border-radius: 10px;
      background: #11151d;
      color: #ffffff;
      font-size: 16px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #5865f2;
    }

    .tier {
      display: grid;
      grid-template-columns: 85px 1fr;
      margin-bottom: 8px;
      background: #11151d;
      border: 1px solid #252a35;
      border-radius: 10px;
      overflow: hidden;
    }

    .tier-name {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #171c26;
      font-size: 18px;
      font-weight: 800;
    }

    .points {
      margin-top: 4px;
      color: #8f98a8;
      font-size: 11px;
      font-weight: 600;
    }

    .players {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 12px;
      min-height: 55px;
    }

    .player {
      padding: 9px 13px;
      background: #202632;
      border: 1px solid #303847;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.15s;
    }

    .player:hover {
      background: #30394a;
      transform: translateY(-1px);
    }

    .player-points {
      margin-left: 6px;
      color: #8f98a8;
      font-size: 11px;
    }

    .empty {
      padding: 8px;
      color: #687181;
    }

    .profile {
      display: none;
      margin-top: 25px;
      padding: 22px;
      background: #0f131b;
      border: 1px solid #2a303d;
      border-radius: 14px;
    }

    .profile.active {
      display: block;
    }

    .profile-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
    }

    .profile-name {
      font-size: 27px;
      font-weight: 800;
    }

    .close-button {
      padding: 9px 14px;
      border: 0;
      border-radius: 8px;
      background: #252b37;
      color: white;
      cursor: pointer;
    }

    .rank-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px;
      margin-bottom: 8px;
      background: #171c25;
      border: 1px solid #252b36;
      border-radius: 10px;
    }

    .rank {
      padding: 6px 10px;
      background: #252d3b;
      border-radius: 7px;
      font-weight: 800;
    }

    .rank-points {
      margin-left: 8px;
      color: #8f98a8;
      font-size: 12px;
    }

    .unranked {
      color: #737c8c;
    }

    #status {
      margin-top: 20px;
      padding: 10px;
      text-align: center;
      color: #7f8795;
      font-size: 13px;
      border-radius: 8px;
    }

    .connected {
      color: #70e08a !important;
    }

    .warning {
      color: #f0c674 !important;
    }

    .error {
      color: #ff6b6b !important;
    }

    .updated {
      margin-top: 5px;
      text-align: center;
      color: #596171;
      font-size: 11px;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 24px;
      }

      .tier {
        grid-template-columns: 70px 1fr;
      }

      .tier-name {
        font-size: 15px;
      }

      .profile-header {
        align-items: flex-start;
      }

      .rank-card {
        gap: 10px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>HAVOC STYX FFA TIER LIST</h1>

  <p>
    Official HAVOC STYX player rankings
  </p>
</header>

<div class="container">

  <input
    id="search"
    type="text"
    placeholder="Search player..."
    autocomplete="off"
  >

  <select id="kitSelect">
    <option value="">Connecting to API...</option>
  </select>

  <div id="tierList"></div>

  <div id="profile" class="profile">

    <div class="profile-header">

      <div
        id="profileName"
        class="profile-name"
      ></div>

      <button
        class="close-button"
        onclick="closeProfile()"
      >
        Close
      </button>

    </div>

    <div id="profileRanks"></div>

  </div>

  <div id="status">
    Connecting to HAVOC STYX API...
  </div>

  <div
    id="updated"
    class="updated"
  ></div>

</div>

<script>
/*
==================================================
HAVOC STYX API
==================================================
*/

const API_URL =
  "https://havoc-bot-production-82b2.up.railway.app/api/tiers";

const REFRESH_INTERVAL =
  10000;


/*
==================================================
TIER POINTS
==================================================
*/

const DEFAULT_POINTS = {
  HT1: 61,
  LT1: 52,
  HT2: 41,
  LT2: 30,
  HT3: 21,
  LT3: 14,
  HT4: 9,
  LT4: 6,
  HT5: 3,
  LT5: 1
};


/*
==================================================
STATE
==================================================
*/

let tierData = null;
let lastGoodData = null;


/*
==================================================
ELEMENTS
==================================================
*/

const searchInput =
  document.getElementById("search");

const kitSelect =
  document.getElementById("kitSelect");

const tierList =
  document.getElementById("tierList");

const profile =
  document.getElementById("profile");

const profileName =
  document.getElementById("profileName");

const profileRanks =
  document.getElementById("profileRanks");

const status =
  document.getElementById("status");

const updated =
  document.getElementById("updated");


/*
==================================================
GET POINTS
==================================================
*/

function getPoints(tier) {

  if (
    tierData &&
    tierData.pointsByTier &&
    typeof tierData.pointsByTier[tier] === "number"
  ) {
    return tierData.pointsByTier[tier];
  }

  return DEFAULT_POINTS[tier] || 0;
}


/*
==================================================
LOAD API
==================================================
*/

async function loadTierData() {

  try {

    const response =
      await fetch(
        API_URL +
        "?t=" +
        Date.now(),
        {
          method: "GET",
          cache: "no-store",
          mode: "cors"
        }
      );


    if (!response.ok) {
      throw new Error(
        "HTTP " +
        response.status
      );
    }


    const result =
      await response.json();


    /*
      Verify the exact API structure.
    */

    if (
      !result ||
      !Array.isArray(result.kits) ||
      !Array.isArray(result.tiers) ||
      !result.data ||
      typeof result.data !== "object"
    ) {
      throw new Error(
        "Invalid tier API response"
      );
    }


    /*
      Save the newest successful data.
    */

    tierData =
      result;

    lastGoodData =
      result;


    buildKitSelector();

    renderTierList();


    /*
      If a profile is open,
      refresh it too.
    */

    const openProfile =
      profile.dataset.player;

    if (openProfile) {
      showProfile(
        openProfile,
        false
      );
    }


    status.textContent =
      "🟢 Connected • Live";

    status.className =
      "connected";


    updated.textContent =
      "Last updated: " +
      new Date().toLocaleTimeString();


  } catch (error) {

    console.error(
      "HAVOC STYX API:",
      error
    );


    /*
      IMPORTANT:
      Do not erase working data
      if one refresh fails.
    */

    if (lastGoodData) {

      tierData =
        lastGoodData;

      status.textContent =
        "🟡 Temporary connection problem • Showing last data";

      status.className =
        "warning";

      renderTierList();

    } else {

      status.textContent =
        "🔴 Unable to connect to HAVOC STYX API";

      status.className =
        "error";


      tierList.innerHTML =
        `
          <div class="empty">
            Unable to load tier data.
            <br><br>
            Please refresh the page.
          </div>
        `;

    }

  }

}


/*
==================================================
KIT DROPDOWN
==================================================
*/

function buildKitSelector() {

  const previousKit =
    kitSelect.value;


  kitSelect.innerHTML =
    "";


  tierData.kits.forEach(
    kit => {

      const option =
        document.createElement(
          "option"
        );


      option.value =
        kit.id;


      option.textContent =
        kit.name;


      kitSelect.appendChild(
        option
      );

    }
  );


  /*
    Keep selected kit after refresh.
  */

  const exists =
    tierData.kits.some(
      kit =>
        kit.id === previousKit
    );


  if (exists) {

    kitSelect.value =
      previousKit;

  } else if (
    tierData.kits.length > 0
  ) {

    kitSelect.value =
      tierData.kits[0].id;

  }

}


/*
==================================================
RENDER TIER LIST
==================================================
*/

function renderTierList() {

  if (!tierData) {
    return;
  }


  tierList.innerHTML =
    "";


  const kitId =
    kitSelect.value;


  const players =
    tierData.data[kitId] || {};


  const search =
    searchInput.value
      .trim()
      .toLowerCase();


  tierData.tiers.forEach(
    tier => {

      const row =
        document.createElement(
          "div"
        );

      row.className =
        "tier";


      const tierName =
        document.createElement(
          "div"
        );

      tierName.className =
        "tier-name";


      const points =
        getPoints(tier);


      tierName.innerHTML =
        `
          <div>${escapeHTML(tier)}</div>
          <div class="points">
            ${points} pts
          </div>
        `;


      const playerContainer =
        document.createElement(
          "div"
        );

      playerContainer.className =
        "players";


      const matchingPlayers =
        Object.entries(players)
          .filter(
            ([player, playerTier]) => {

              if (
                playerTier !== tier
              ) {
                return false;
              }


              if (!search) {
                return true;
              }


              return player
                .toLowerCase()
                .includes(search);

            }
          )
          .sort(
            ([a], [b]) =>
              a.localeCompare(b)
          );


      if (
        matchingPlayers.length === 0
      ) {

        const empty =
          document.createElement(
            "div"
          );

        empty.className =
          "empty";

        empty.textContent =
          "No players";

        playerContainer.appendChild(
          empty
        );

      } else {

        matchingPlayers.forEach(
          ([player, playerTier]) => {

            const button =
              document.createElement(
                "div"
              );


            button.className =
              "player";


            button.innerHTML =
              `
                <span>
                  ${escapeHTML(player)}
                </span>

                <span class="player-points">
                  +${getPoints(playerTier)}
                </span>
              `;


            button.onclick =
              () =>
                showProfile(player);


            playerContainer.appendChild(
              button
            );

          }
        );

      }


      row.appendChild(
        tierName
      );

      row.appendChild(
        playerContainer
      );

      tierList.appendChild(
        row
      );

    }
  );

}


/*
==================================================
PLAYER PROFILE
==================================================
*/

function showProfile(
  player,
  scroll = true
) {

  if (!tierData) {
    return;
  }


  profile.dataset.player =
    player;


  profileName.textContent =
    player;


  profileRanks.innerHTML =
    "";


  let totalPoints =
    0;

  let rankedKits =
    0;


  tierData.kits.forEach(
    kit => {

      const kitData =
        tierData.data[
          kit.id
        ] || {};


      const rank =
        kitData[player];


      const card =
        document.createElement(
          "div"
        );

      card.className =
        "rank-card";


      const kitName =
        document.createElement(
          "div"
        );

      kitName.textContent =
        kit.name;


      const rankDisplay =
        document.createElement(
          "div"
        );


      if (rank) {

        const points =
          getPoints(rank);


        totalPoints +=
          points;

        rankedKits++;


        rankDisplay.innerHTML =
          `
            <span class="rank">
              ${escapeHTML(rank)}
            </span>

            <span class="rank-points">
              ${points} pts
            </span>
          `;

      } else {

        rankDisplay.className =
          "unranked";

        rankDisplay.textContent =
          "Unranked";

      }


      card.appendChild(
        kitName
      );

      card.appendChild(
        rankDisplay
      );

      profileRanks.appendChild(
        card
      );

    }
  );


  const summary =
    document.createElement(
      "div"
    );


  summary.style.marginBottom =
    "15px";


  summary.style.color =
    "#8f98a8";


  summary.innerHTML =
    `
      <strong style="color:white">
        ${escapeHTML(player)}
      </strong>
      <br>
      ⭐ Total Points:
      <strong style="color:white">
        ${totalPoints}
      </strong>
      • Ranked Kits:
      <strong style="color:white">
        ${rankedKits}
      </strong>
    `;


  profileRanks.prepend(
    summary
  );


  profile.classList.add(
    "active"
  );


  if (scroll) {

    profile.scrollIntoView({
      behavior: "smooth",
      block: "start"
    });

  }

}


/*
==================================================
CLOSE PROFILE
==================================================
*/

function closeProfile() {

  profile.classList.remove(
    "active"
  );

  delete profile.dataset.player;

}


/*
==================================================
SEARCH
==================================================
*/

searchInput.addEventListener(
  "input",
  renderTierList
);


/*
==================================================
KIT CHANGE
==================================================
*/

kitSelect.addEventListener(
  "change",
  renderTierList
);


/*
==================================================
HTML ESCAPE
==================================================
*/

function escapeHTML(value) {

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/*
==================================================
INITIAL LOAD
==================================================
*/

loadTierData();


/*
==================================================
LIVE UPDATE EVERY 10 SECONDS
==================================================
*/

setInterval(
  loadTierData,
  REFRESH_INTERVAL
);

</script>

</body>
  </html>
