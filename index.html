<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>HAVOC STYX — Tier List</title>
<link rel="stylesheet" href="style.css">

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: linear-gradient(135deg, #080808 0%, #0a0e14 100%);
  color: white;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  min-height: 100vh;
}

header {
  padding: 35px 20px;
  text-align: center;
  background: rgba(8, 8, 8, 0.98);
  backdrop-filter: blur(10px);
  border-bottom: 2px solid #ff2020;
  box-shadow: 0 4px 20px rgba(255, 32, 32, 0.1);
  animation: slideDown 0.5s ease-out;
}

@keyframes slideDown {
  from {
    transform: translateY(-100%);
    opacity: 0;
  }
  to {
    transform: translateY(0);
    opacity: 1;
  }
}

h1 {
  margin: 0;
  font-size: 30px;
  background: linear-gradient(135deg, #ffffff 0%, #ff2020 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  text-shadow: 0 0 30px rgba(255, 32, 32, 0.3);
}

.subtitle {
  margin-top: 8px;
  color: #aaa;
  letter-spacing: 1px;
  font-size: 14px;
}

.container {
  width: 100%;
  max-width: 1000px;
  margin: auto;
  padding: 20px;
  animation: fadeIn 0.8s ease-out;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.controls {
  display: grid;
  grid-template-columns: 1fr 240px;
  gap: 12px;
  margin-bottom: 20px;
}

input,
select {
  width: 100%;
  padding: 14px;
  border: 2px solid #292929;
  border-radius: 10px;
  background: rgba(17, 17, 17, 0.8);
  color: white;
  font-size: 16px;
  outline: none;
  transition: all 0.3s ease;
  backdrop-filter: blur(5px);
}

input:focus,
select:focus {
  border-color: #ff2020;
  box-shadow: 0 0 20px rgba(255, 32, 32, 0.3);
}

input::placeholder {
  color: #666;
}

.tier {
  display: grid;
  grid-template-columns: 80px 1fr;
  margin-bottom: 12px;
  overflow: hidden;
  background: rgba(17, 17, 17, 0.8);
  border: 2px solid #292929;
  border-radius: 12px;
  transition: all 0.3s ease;
  backdrop-filter: blur(5px);
}

.tier:hover {
  border-color: #ff2020;
  transform: translateX(4px);
  box-shadow: 0 8px 24px rgba(255, 32, 32, 0.15);
}

.tier-name {
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #ff2020 0%, #ff5050 100%);
  font-weight: 900;
  font-size: 18px;
  color: white;
  transition: all 0.3s ease;
}

.tier:hover .tier-name {
  text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
}

.players {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 12px;
  min-height: 55px;
  align-items: center;
}

.player {
  padding: 9px 13px;
  background: rgba(36, 36, 36, 0.8);
  border: 2px solid #292929;
  border-radius: 8px;
  cursor: pointer;
  font-weight: 700;
  transition: all 0.3s ease;
}

.player:hover {
  background: rgba(255, 32, 32, 0.2);
  border-color: #ff2020;
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(255, 32, 32, 0.2);
}

.empty {
  padding: 8px;
  color: #888;
}

.profile {
  display: none;
  margin-top: 25px;
  overflow: hidden;
  background: rgba(15, 19, 27, 0.8);
  border: 2px solid #ff2020;
  border-radius: 14px;
  backdrop-filter: blur(10px);
  animation: slideUp 0.4s ease-out;
}

@keyframes slideUp {
  from {
    transform: translateY(30px);
    opacity: 0;
  }
  to {
    transform: translateY(0);
    opacity: 1;
  }
}

.profile.active {
  display: block;
}

.profile-header {
  padding: 25px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: rgba(20, 26, 35, 0.9);
  border-bottom: 1px solid #ff2020;
}

.profile-name {
  font-size: 28px;
  font-weight: 900;
  background: linear-gradient(135deg, #ffffff 0%, #ff2020 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.close {
  padding: 10px 16px;
  border: 2px solid #ff2020;
  border-radius: 8px;
  background: transparent;
  color: #ff2020;
  font-weight: bold;
  cursor: pointer;
  transition: all 0.3s ease;
}

.close:hover {
  background: #ff2020;
  color: white;
  box-shadow: 0 6px 20px rgba(255, 32, 32, 0.4);
}

.profile-body {
  padding: 20px;
}

.kit-card {
  display: flex;
  justify-content: space-between;
  padding: 14px;
  margin-bottom: 8px;
  background: rgba(23, 28, 37, 0.8);
  border: 2px solid #292929;
  border-radius: 10px;
  transition: all 0.3s ease;
}

.kit-card:hover {
  border-color: #ff2020;
  background: rgba(23, 28, 37, 0.95);
  transform: translateX(4px);
}

.rank {
  font-weight: 900;
  color: #ff2020;
}

.unranked {
  color: #737c8c;
}

#status {
  margin-top: 20px;
  text-align: center;
  color: #aaa;
  font-size: 14px;
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.7; }
}

.error {
  color: #ff6b6b !important;
}

.debug {
  margin-top: 12px;
  padding: 12px;
  background: rgba(17, 17, 17, 0.8);
  border: 1px solid #292929;
  border-radius: 10px;
  color: #8f98a8;
  font-size: 12px;
  word-break: break-word;
  backdrop-filter: blur(5px);
}

@media (max-width: 650px) {
  .controls {
    grid-template-columns: 1fr;
  }
  
  h1 {
    font-size: 24px;
  }
  
  header {
    padding: 20px 15px;
  }
}
</style>
</head>

<body>

<header>
  <h1>HAVOC STYX</h1>
  <div class="subtitle">
    FFA • OFFICIAL PLAYER TIER LIST
  </div>
</header>

<div class="container">

  <div class="controls">

    <input
      id="search"
      type="text"
      placeholder="Search player..."
    >

    <select id="kitSelect" disabled>
      <option value="">Loading kits...</option>
    </select>

  </div>

  <div id="tierList">
    <div class="empty">
      Loading HAVOC STYX...
    </div>
  </div>

  <div id="profile" class="profile">

    <div class="profile-header">

      <div id="profileName" class="profile-name"></div>

      <button
        class="close"
        onclick="closeProfile()"
      >
        Close
      </button>

    </div>

    <div
      id="profileBody"
      class="profile-body"
    ></div>

  </div>

  <div id="status">
    Starting website...
  </div>

  <div id="debug" class="debug">
    Waiting for JavaScript...
  </div>

</div>

<script>

/* =========================================
   RAILWAY API
========================================= */

const API_URL =
  "https://havoc-bot-production-82b2.up.railway.app";


/* =========================================
   DEBUG
========================================= */

const debug =
  document.getElementById("debug");

const status =
  document.getElementById("status");

debug.textContent =
  "✅ JavaScript running.";


/* =========================================
   DATA
========================================= */

let tierData = null;


/* =========================================
   LOAD API
========================================= */

async function loadData() {

  // show friendly connecting status
  status.textContent =
    "🔄 Connecting to HAVOC STYX API...";

  debug.textContent =
    "Testing: " +
    API_URL +
    "/api/tiers";


  try {

    const response =
      await fetch(
        API_URL +
        "/api/tiers?t=" +
        Date.now(),
        {
          method: "GET",
          mode: "cors",
          cache: "no-store",
          headers: {
            "Accept":
              "application/json"
          }
        }
      );

    if (!response.ok) {
      // friendly error for HTTP status problems
      throw new Error("HTTP " + response.status);
    }

    const result =
      await response.json();

    console.log(
      "HAVOC STYX API:",
      result
    );

    // validate shape
    if (
      !result ||
      !Array.isArray(result.kits) ||
      !Array.isArray(result.tiers) ||
      typeof result.data !== "object"
    ) {

      // don't show raw TypeError/etc. — provide a friendly message
      status.textContent =
        "⚠️ Unexpected API response";

      status.classList.add("error");

      debug.textContent =
        "❌ The API returned an unexpected response format. Please contact the server admin or try again later.";

      throw new Error("Invalid API format");

    }

    tierData = result;

    createKitSelector();

    renderTierList();

    status.textContent =
      "🟢 Connected to HAVOC STYX";

    debug.textContent =
      "✅ API connected successfully • " +
      result.kits.length +
      " kits loaded • " +
      result.tiers.length +
      " tiers available";

  } catch (error) {

    // log full error to console for debugging but show friendly message in UI
    console.error(
      "API ERROR:",
      error
    );

    status.textContent =
      "🔴 API connection failed";

    status.classList.add(
      "error"
    );

    // Provide a friendly message and avoid showing raw error types like "TypeError"
    let friendlyMessage =
      "Could not connect to the HAVOC STYX API. Please check your internet connection or try again later.";

    // Append the error message only when it's useful and not too technical
    if (error && error.message && !/typeerror/i.test(error.message)) {
      friendlyMessage += " (" + error.message + ")";
    }

    debug.textContent =
      "❌ " + friendlyMessage;

    // leave kit selector disabled so user can't interact with broken state
    const select = document.getElementById("kitSelect");
    if (select) {
      select.innerHTML = "<option value=''>Error loading kits</option>";
      select.disabled = true;
    }

  }

}


/* =========================================
   KIT SELECTOR
========================================= */

function createKitSelector() {

  const select =
    document.getElementById(
      "kitSelect"
    );

  select.innerHTML = "";

  if (!tierData || !tierData.kits || tierData.kits.length === 0) {
    const option = document.createElement("option");
    option.value = "";
    option.textContent = "No kits found";
    select.appendChild(option);
    select.disabled = true;
    return;
  }

  // populate kits
  tierData.kits.forEach(
    kit => {

      const option =
        document.createElement(
          "option"
        );

      option.value =
        kit.id;

      option.textContent =
        kit.name;

      select.appendChild(
        option
      );

    }
  );

  // enable selector and choose the first kit by default
  select.disabled = false;
  if (!select.value && tierData.kits.length > 0) {
    select.value = tierData.kits[0].id;
  }

}


/* =========================================
   TIER LIST
========================================= */

function renderTierList() {

  if (!tierData) return;

  const kit =
    document.getElementById(
      "kitSelect"
    ).value;

  const search =
    document.getElementById(
      "search"
    ).value
      .trim()
      .toLowerCase();

  // ensure players object exists for the selected kit
  const players =
    tierData.data[kit] || {};

  const container =
    document.getElementById(
      "tierList"
    );

  container.innerHTML = "";

  tierData.tiers.forEach(
    tier => {

      const row =
        document.createElement(
          "div"
        );

      row.className =
        "tier";

      const tierName =
        document.createElement(
          "div"
        );

      tierName.className =
        "tier-name";

      tierName.textContent =
        tier;

      const playerBox =
        document.createElement(
          "div"
        );

      playerBox.className =
        "players";

      const names =
        Object.entries(
          players
        )
        .filter(
          ([name, rank]) =>
            rank === tier &&
            (
              !search ||
              name
                .toLowerCase()
                .includes(search)
            )
        )
        .map(
          ([name]) =>
            name
        );

      if (
        names.length === 0
      ) {

        const empty =
          document.createElement(
            "div"
          );

        empty.className =
          "empty";

        empty.textContent =
          "No players";

        playerBox.appendChild(
          empty
        );

      } else {

        names.forEach(
          name => {

            const player =
              document.createElement(
                "div"
              );

            player.className =
              "player";

            player.textContent =
              name;

            player.onclick =
              () => showProfile(name);

            playerBox.appendChild(
              player
            );

          }
        );

      }

      row.appendChild(
        tierName
      );

      row.appendChild(
        playerBox
      );

      container.appendChild(
        row
      );

    }
  );

}


/* =========================================
   PLAYER PROFILE
========================================= */

function showProfile(
  playerName
) {

  if (!tierData) return;

  const profile =
    document.getElementById(
      "profile"
    );

  const profileName =
    document.getElementById(
      "profileName"
    );

  const body =
    document.getElementById(
      "profileBody"
    );

  profileName.textContent =
    playerName;

  body.innerHTML = "";

  tierData.kits.forEach(
    kit => {

      const card =
        document.createElement(
          "div"
        );

      card.className =
        "kit-card";

      const name =
        document.createElement(
          "span"
        );

      name.textContent =
        kit.name;

      const rank =
        document.createElement(
          "span"
        );

      const playerRank =
        (
          tierData.data[kit.id] ||
          {}
        )[playerName];

      if (playerRank) {

        rank.textContent =
          playerRank;

        rank.className = "rank";

      } else {

        rank.textContent =
          "Unranked";

        rank.className =
          "rank unranked";

      }

      card.appendChild(
        name
      );

      card.appendChild(
        rank
      );

      body.appendChild(
        card
      );

    }
  );

  profile.classList.add(
    "active"
  );

  profile.scrollIntoView({
    behavior: "smooth"
  });

}

/* =========================================
   CLOSE PROFILE
========================================= */

function closeProfile() {

  document
    .getElementById(
      "profile"
    )
    .classList.remove(
      "active"
    );

}

/* =========================================
   EVENTS
========================================= */

document
  .getElementById("search")
  .addEventListener(
    "input",
    renderTierList
  );

document
  .getElementById("kitSelect")
  .addEventListener(
    "change",
    renderTierList
  );

/* =========================================
   START
========================================= */

loadData();

/* =========================================
   AUTO UPDATE
========================================= */

setInterval(
  loadData,
  10000
);

</script>

</body>
</html>
