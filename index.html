<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HAVOC STYX — Tier List</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #080808;
  color: white;
  font-family: Arial, Helvetica, sans-serif;
}

header {
  padding: 35px 20px;
  text-align: center;
  background: #090909;
  border-bottom: 2px solid #ff2020;
}

h1 {
  margin: 0;
  font-size: 30px;
}

.subtitle {
  margin-top: 8px;
  color: #aaa;
}

.container {
  max-width: 1000px;
  margin: auto;
  padding: 20px;
}

.controls {
  display: grid;
  grid-template-columns: 1fr 250px;
  gap: 12px;
  margin-bottom: 15px;
}

input,
select {
  width: 100%;
  padding: 14px;
  background: #111;
  border: 2px solid #292929;
  border-radius: 10px;
  color: white;
  font-size: 16px;
}

.view-buttons {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
}

.view-buttons button,
.close {
  flex: 1;
  padding: 12px;
  border: 2px solid #292929;
  border-radius: 10px;
  background: #111;
  color: #aaa;
  font-weight: bold;
  cursor: pointer;
}

.view-buttons button.active,
.view-buttons button:hover,
.close:hover {
  background: #ff2020;
  border-color: #ff2020;
  color: white;
}

.tier {
  display: grid;
  grid-template-columns: 85px 1fr;
  margin-bottom: 10px;
  overflow: hidden;
  background: #111;
  border: 2px solid #292929;
  border-radius: 10px;
}

.tier-name {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: #ff2020;
  font-weight: 900;
}

.tier-points {
  font-size: 11px;
  margin-top: 3px;
}

.players {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 12px;
  min-height: 58px;
  align-items: center;
}

.player {
  display: flex;
  gap: 8px;
  align-items: center;
  padding: 9px 12px;
  background: #242424;
  border: 1px solid #333;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
}

.player:hover {
  border-color: #ff2020;
  background: #301414;
}

.points {
  color: #ff5050;
  font-size: 11px;
}

.empty {
  color: #777;
}

.profile {
  display: none;
  margin-top: 25px;
  background: #101010;
  border: 2px solid #ff2020;
  border-radius: 14px;
  overflow: hidden;
}

.profile.active {
  display: block;
}

.profile-header {
  padding: 22px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #333;
}

.profile-name {
  font-size: 28px;
  font-weight: 900;
}

.profile-body {
  padding: 20px;
}

.profile-card {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px;
  margin-bottom: 8px;
  background: #181818;
  border: 1px solid #292929;
  border-radius: 10px;
}

.rank {
  color: #ff5050;
  font-weight: 900;
}

.unranked {
  color: #777;
}

.leaderboard {
  display: none;
}

.leaderboard.active {
  display: block;
}

.leader-row {
  display: grid;
  grid-template-columns: 50px 1fr 100px;
  gap: 10px;
  padding: 14px;
  margin-bottom: 8px;
  background: #111;
  border: 1px solid #292929;
  border-radius: 10px;
  cursor: pointer;
}

.leader-row:hover {
  border-color: #ff2020;
}

.total-points {
  color: #ff5050;
  font-weight: 900;
}

#status {
  margin-top: 20px;
  padding: 12px;
  text-align: center;
  border-radius: 10px;
  color: #aaa;
}

.status-ok {
  color: #86efac !important;
  background: #102016;
}

.status-error {
  color: #fca5a5 !important;
  background: #251010;
}

.last-updated {
  text-align: center;
  color: #666;
  font-size: 11px;
  margin-top: 8px;
}

@media(max-width:650px) {
  .controls {
    grid-template-columns: 1fr;
  }

  h1 {
    font-size: 24px;
  }

  .tier {
    grid-template-columns: 70px 1fr;
  }

  .leader-row {
    grid-template-columns: 40px 1fr 80px;
  }
}
</style>
</head>

<body>

<header>
  <h1>HAVOC STYX</h1>
  <div class="subtitle">
    FFA • OFFICIAL PLAYER TIER LIST
  </div>
</header>

<div class="container">

  <div class="controls">

    <input
      id="search"
      type="text"
      placeholder="Search player..."
      autocomplete="off"
    >

    <select id="kitSelect">
      <option>Connecting...</option>
    </select>

  </div>

  <div class="view-buttons">

    <button
      id="tierButton"
      class="active"
      onclick="showTierView()"
    >
      TIER LIST
    </button>

    <button
      id="leaderButton"
      onclick="showLeaderboard()"
    >
      🏆 LEADERBOARD
    </button>

  </div>

  <div id="tierList">
    <div class="empty">
      Connecting to HAVOC STYX...
    </div>
  </div>

  <div
    id="leaderboard"
    class="leaderboard"
  ></div>

  <div
    id="profile"
    class="profile"
  >

    <div class="profile-header">

      <div
        id="profileName"
        class="profile-name"
      ></div>

      <button
        class="close"
        onclick="closeProfile()"
      >
        Close
      </button>

    </div>

    <div
      id="profileBody"
      class="profile-body"
    ></div>

  </div>

  <div id="status">
    Connecting...
  </div>

  <div
    id="lastUpdated"
    class="last-updated"
  ></div>

</div>

<script>

/* =========================================
   API
========================================= */

const API_URL =
  "https://havoc-bot-production-82b2.up.railway.app";

const REFRESH_TIME =
  10000;


/* =========================================
   DATA
========================================= */

let tierData = null;

let selectedPlayer = null;

let lastGoodData = null;


/* =========================================
   ELEMENTS
========================================= */

const search =
  document.getElementById("search");

const kitSelect =
  document.getElementById("kitSelect");

const tierList =
  document.getElementById("tierList");

const leaderboard =
  document.getElementById("leaderboard");

const profile =
  document.getElementById("profile");

const status =
  document.getElementById("status");

const lastUpdated =
  document.getElementById("lastUpdated");


/* =========================================
   LOAD DATA
========================================= */

async function loadData() {

  try {

    const response =
      await fetch(
        API_URL +
        "/api/tiers?t=" +
        Date.now(),
        {
          method: "GET",
          mode: "cors",
          cache: "no-store"
        }
      );


    if (!response.ok) {

      throw new Error(
        "HTTP " +
        response.status
      );

    }


    const data =
      await response.json();


    if (
      !Array.isArray(data.kits) ||
      !Array.isArray(data.tiers) ||
      !data.data
    ) {

      throw new Error(
        "Invalid API response"
      );

    }


    tierData =
      data;

    lastGoodData =
      data;


    buildKitSelector();

    renderTierList();

    renderLeaderboard();


    status.textContent =
      "🟢 Connected • Auto-updating every 10 seconds";

    status.className =
      "status-ok";


    lastUpdated.textContent =
      "Last updated: " +
      new Date().toLocaleTimeString();


  } catch (error) {

    console.error(
      "HAVOC STYX API ERROR:",
      error
    );


    /*
       IMPORTANT:
       Do NOT destroy the current list
       when one refresh fails.
    */

    if (lastGoodData) {

      tierData =
        lastGoodData;

      status.textContent =
        "🟡 Connection temporarily unavailable • showing last saved data";

      status.className =
        "status-ok";

    } else {

      status.textContent =
        "🔴 Unable to connect to HAVOC STYX API";

      status.className =
        "status-error";

    }

  }

}


/* =========================================
   KIT SELECTOR
========================================= */

function buildKitSelector() {

  const previous =
    kitSelect.value;


  kitSelect.innerHTML =
    "";


  tierData.kits.forEach(
    kit => {

      const option =
        document.createElement(
          "option"
        );

      option.value =
        kit.id;

      option.textContent =
        kit.name;

      kitSelect.appendChild(
        option
      );

    }
  );


  if (
    tierData.kits.some(
      kit =>
        kit.id === previous
    )
  ) {

    kitSelect.value =
      previous;

  } else {

    kitSelect.value =
      tierData.kits[0].id;

  }

}


/* =========================================
   GET POINTS
========================================= */

function getPoints(tier) {

  if (
    tierData.pointsByTier &&
    tierData.pointsByTier[tier]
  ) {

    return tierData.pointsByTier[tier];

  }


  const fallback = {
    HT1: 61,
    LT1: 52,
    HT2: 41,
    LT2: 30,
    HT3: 21,
    LT3: 14,
    HT4: 9,
    LT4: 6,
    HT5: 3,
    LT5: 1
  };


  return fallback[tier] || 0;

}


/* =========================================
   TIER LIST
========================================= */

function renderTierList() {

  if (!tierData) {
    return;
  }


  tierList.innerHTML =
    "";


  const kit =
    kitSelect.value;


  const searchText =
    search.value
      .trim()
      .toLowerCase();


  const players =
    tierData.data[kit] || {};


  tierData.tiers.forEach(
    tier => {

      const row =
        document.createElement(
          "div"
        );

      row.className =
        "tier";


      const tierName =
        document.createElement(
          "div"
        );

      tierName.className =
        "tier-name";

      tierName.innerHTML =
        `
          <div>${tier}</div>
          <div class="tier-points">
            ${getPoints(tier)} pts
          </div>
        `;


      const playerBox =
        document.createElement(
          "div"
        );

      playerBox.className =
        "players";


      const names =
        Object.entries(
          players
        )
        .filter(
          ([name, rank]) => {

            return (
              rank === tier &&
              (
                !searchText ||
                name
                  .toLowerCase()
                  .includes(searchText)
              )
            );

          }
        );


      if (
        names.length === 0
      ) {

        const empty =
          document.createElement(
            "div"
          );

        empty.className =
          "empty";

        empty.textContent =
          "No players";

        playerBox.appendChild(
          empty
        );

      } else {

        names.forEach(
          ([name]) => {

            const player =
              document.createElement(
                "div"
              );

            player.className =
              "player";


            player.innerHTML =
              `
                <span>${escapeHtml(name)}</span>
                <span class="points">
                  +${getPoints(tier)}
                </span>
              `;


            player.onclick =
              () =>
                showProfile(name);


            playerBox.appendChild(
              player
            );

          }
        );

      }


      row.appendChild(
        tierName
      );

      row.appendChild(
        playerBox
      );

      tierList.appendChild(
        row
      );

    }
  );

}


/* =========================================
   PLAYER PROFILE
========================================= */

function showProfile(
  playerName
) {

  selectedPlayer =
    playerName;


  document.getElementById(
    "profileName"
  ).textContent =
    playerName;


  const body =
    document.getElementById(
      "profileBody"
    );


  body.innerHTML =
    "";


  let totalPoints =
    0;

  let rankedKits =
    0;


  tierData.kits.forEach(
    kit => {

      const rank =
        tierData
          .data[kit.id]?.[
            playerName
          ];


      const card =
        document.createElement(
          "div"
        );

      card.className =
        "profile-card";


      const left =
        document.createElement(
          "span"
        );

      left.textContent =
        kit.name;


      const right =
        document.createElement(
          "span"
        );


      if (rank) {

        const points =
          getPoints(rank);


        totalPoints +=
          points;

        rankedKits++;


        right.className =
          "rank";

        right.textContent =
          `${rank} • ${points} pts`;

      } else {

        right.className =
          "unranked";

        right.textContent =
          "Unranked";

      }


      card.appendChild(
        left
      );

      card.appendChild(
        right
      );

      body.appendChild(
        card
      );

    }
  );


  const total =
    document.createElement(
      "div"
    );

  total.style.marginBottom =
    "15px";

  total.style.fontWeight =
    "bold";

  total.style.color =
    "#ff5050";

  total.textContent =
    `⭐ Total Points: ${totalPoints} • Ranked Kits: ${rankedKits}`;


  body.prepend(
    total
  );


  profile.classList.add(
    "active"
  );


  profile.scrollIntoView({
    behavior: "smooth"
  });

}


/* =========================================
   CLOSE PROFILE
========================================= */

function closeProfile() {

  selectedPlayer =
    null;

  profile.classList.remove(
    "active"
  );

}


/* =========================================
   LEADERBOARD
========================================= */

function renderLeaderboard() {

  if (!tierData) {
    return;
  }


  const totals = {};


  tierData.kits.forEach(
    kit => {

      const players =
        tierData.data[
          kit.id
        ] || {};


      Object.entries(
        players
      ).forEach(
        ([name, tier]) => {

          if (!totals[name]) {

            totals[name] = {
              points: 0,
              kits: 0
            };

          }


          totals[name].points +=
            getPoints(tier);

          totals[name].kits++;

        }
      );

    }
  );


  const sorted =
    Object.entries(
      totals
    )
    .sort(
      (a, b) =>
        b[1].points -
        a[1].points
    );


  leaderboard.innerHTML =
    "";


  if (
    sorted.length === 0
  ) {

    leaderboard.innerHTML =
      `<div class="empty">
        No ranked players yet.
      </div>`;

    return;
  }


  sorted.forEach(
    ([name, info], index) => {

      const row =
        document.createElement(
          "div"
        );

      row.className =
        "leader-row";


      row.innerHTML =
        `
          <strong>#${index + 1}</strong>
          <span>${escapeHtml(name)}</span>
          <span class="total-points">
            ${info.points} pts
          </span>
        `;


      row.onclick =
        () =>
          showProfile(name);


      leaderboard.appendChild(
        row
      );

    }
  );

}


/* =========================================
   VIEW
========================================= */

function showTierView() {

  tierList.style.display =
    "";

  leaderboard.style.display =
    "none";


  document.getElementById(
    "tierButton"
  ).classList.add(
    "active"
  );


  document.getElementById(
    "leaderButton"
  ).classList.remove(
    "active"
  );

}


function showLeaderboard() {

  tierList.style.display =
    "none";

  leaderboard.style.display =
    "block";


  document.getElementById(
    "tierButton"
  ).classList.remove(
    "active"
  );


  document.getElementById(
    "leaderButton"
  ).classList.add(
    "active"
  );


  renderLeaderboard();

}


/* =========================================
   SEARCH / KIT
========================================= */

search.addEventListener(
  "input",
  renderTierList
);


kitSelect.addEventListener(
  "change",
  renderTierList
);


/* =========================================
   HTML ESCAPE
========================================= */

function escapeHtml(
  value
) {

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================================
   START
========================================= */

loadData();


/* =========================================
   UPDATE EVERY 10 SECONDS
========================================= */

setInterval(
  loadData,
  REFRESH_TIME
);

</script>

</body>
  </html>
