<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAVOC STYX — Tier List</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #07090d;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  padding: 35px 20px;
  text-align: center;
  background: #0e1118;
  border-bottom: 1px solid #252a35;
}

h1 {
  margin: 0;
  font-size: 30px;
}

.subtitle {
  margin-top: 8px;
  color: #8f98a8;
}

.container {
  width: 100%;
  max-width: 1000px;
  margin: auto;
  padding: 20px;
}

.controls {
  display: grid;
  grid-template-columns: 1fr 240px;
  gap: 12px;
  margin-bottom: 20px;
}

input,
select {
  width: 100%;
  padding: 14px;
  border: 1px solid #303744;
  border-radius: 10px;
  background: #11151d;
  color: white;
  font-size: 16px;
  outline: none;
}

.tier {
  display: grid;
  grid-template-columns: 80px 1fr;
  margin-bottom: 8px;
  overflow: hidden;
  background: #11151d;
  border: 1px solid #252a35;
  border-radius: 10px;
}

.tier-name {
  display: flex;
  align-items: center;
  justify-content: center;
  background: #171c26;
  font-weight: 900;
}

.players {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 12px;
  min-height: 55px;
}

.player {
  padding: 9px 13px;
  background: #202632;
  border: 1px solid #303847;
  border-radius: 8px;
  cursor: pointer;
  font-weight: 700;
}

.player:hover {
  background: #30394a;
}

.empty {
  padding: 8px;
  color: #687181;
}

.profile {
  display: none;
  margin-top: 25px;
  overflow: hidden;
  background: #0f131b;
  border: 1px solid #2a303d;
  border-radius: 14px;
}

.profile.active {
  display: block;
}

.profile-header {
  padding: 25px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #141a23;
}

.profile-name {
  font-size: 28px;
  font-weight: 900;
}

.close {
  padding: 9px 14px;
  border: 0;
  border-radius: 8px;
  background: #252b37;
  color: white;
}

.profile-body {
  padding: 20px;
}

.kit-card {
  display: flex;
  justify-content: space-between;
  padding: 14px;
  margin-bottom: 8px;
  background: #171c25;
  border: 1px solid #252b36;
  border-radius: 10px;
}

.rank {
  font-weight: 900;
}

.unranked {
  color: #737c8c;
}

#status {
  margin-top: 20px;
  text-align: center;
  color: #7f8795;
  font-size: 13px;
}

.error {
  color: #ff6b6b !important;
}

.debug {
  margin-top: 12px;
  padding: 12px;
  background: #11151d;
  border: 1px solid #252a35;
  border-radius: 10px;
  color: #8f98a8;
  font-size: 12px;
  word-break: break-word;
}

@media (max-width: 650px) {
  .controls {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<header>
  <h1>HAVOC STYX</h1>
  <div class="subtitle">
    FFA • OFFICIAL PLAYER TIER LIST
  </div>
</header>

<div class="container">

  <div class="controls">

    <input
      id="search"
      type="text"
      placeholder="Search player..."
    >

    <select id="kitSelect">
      <option value="">Connecting...</option>
    </select>

  </div>

  <div id="tierList">
    <div class="empty">
      Loading HAVOC STYX...
    </div>
  </div>

  <div id="profile" class="profile">

    <div class="profile-header">

      <div id="profileName" class="profile-name"></div>

      <button
        class="close"
        onclick="closeProfile()"
      >
        Close
      </button>

    </div>

    <div
      id="profileBody"
      class="profile-body"
    ></div>

  </div>

  <div id="status">
    Starting website...
  </div>

  <div id="debug" class="debug">
    Waiting for JavaScript...
  </div>

</div>

<script>

/* =========================================
   RAILWAY API
========================================= */

const API_URL =
  "https://havoc-bot-production-82b2.up.railway.app";


/* =========================================
   DEBUG
========================================= */

const debug =
  document.getElementById("debug");

const status =
  document.getElementById("status");

debug.textContent =
  "✅ New index.html JavaScript is running.";


/* =========================================
   DATA
========================================= */

let tierData = null;


/* =========================================
   LOAD API
========================================= */

async function loadData() {

  status.textContent =
    "Connecting to HAVOC STYX API...";

  debug.textContent =
    "Testing: " +
    API_URL +
    "/api/tiers";


  try {

    const response =
      await fetch(
        API_URL +
        "/api/tiers?t=" +
        Date.now(),
        {
          method: "GET",
          mode: "cors",
          cache: "no-store",
          headers: {
            "Accept":
              "application/json"
          }
        }
      );


    if (!response.ok) {

      throw new Error(
        "HTTP " +
        response.status
      );

    }


    const result =
      await response.json();


    console.log(
      "HAVOC STYX API:",
      result
    );


    if (
      !result.kits ||
      !result.tiers ||
      !result.data
    ) {

      throw new Error(
        "API response format is invalid"
      );

    }


    tierData =
      result;


    createKitSelector();

    renderTierList();


    status.textContent =
      "🟢 Connected to HAVOC STYX";


    debug.textContent =
      "✅ API connected successfully • " +
      result.kits.length +
      " kits loaded";


  } catch (error) {

    console.error(
      "API ERROR:",
      error
    );


    status.textContent =
      "🔴 API connection failed";

    status.classList.add(
      "error"
    );


    debug.textContent =
      "❌ " +
      error.name +
      ": " +
      error.message;

  }

}


/* =========================================
   KIT SELECTOR
========================================= */

function createKitSelector() {

  const select =
    document.getElementById(
      "kitSelect"
    );

  select.innerHTML = "";


  tierData.kits.forEach(
    kit => {

      const option =
        document.createElement(
          "option"
        );

      option.value =
        kit.id;

      option.textContent =
        kit.name;

      select.appendChild(
        option
      );

    }
  );

}


/* =========================================
   TIER LIST
========================================= */

function renderTierList() {

  if (!tierData) return;


  const kit =
    document.getElementById(
      "kitSelect"
    ).value;


  const search =
    document.getElementById(
      "search"
    ).value
      .trim()
      .toLowerCase();


  const players =
    tierData.data[kit] || {};


  const container =
    document.getElementById(
      "tierList"
    );


  container.innerHTML = "";


  tierData.tiers.forEach(
    tier => {

      const row =
        document.createElement(
          "div"
        );

      row.className =
        "tier";


      const tierName =
        document.createElement(
          "div"
        );

      tierName.className =
        "tier-name";

      tierName.textContent =
        tier;


      const playerBox =
        document.createElement(
          "div"
        );

      playerBox.className =
        "players";


      const names =
        Object.entries(
          players
        )
        .filter(
          ([name, rank]) =>
            rank === tier &&
            (
              !search ||
              name
                .toLowerCase()
                .includes(search)
            )
        )
        .map(
          ([name]) =>
            name
        );


      if (
        names.length === 0
      ) {

        const empty =
          document.createElement(
            "div"
          );

        empty.className =
          "empty";

        empty.textContent =
          "No players";

        playerBox.appendChild(
          empty
        );

      } else {

        names.forEach(
          name => {

            const player =
              document.createElement(
                "div"
              );

            player.className =
              "player";

            player.textContent =
              name;

            player.onclick =
              () => showProfile(name);

            playerBox.appendChild(
              player
            );

          }
        );

      }


      row.appendChild(
        tierName
      );

      row.appendChild(
        playerBox
      );

      container.appendChild(
        row
      );

    }
  );

}


/* =========================================
   PLAYER PROFILE
========================================= */

function showProfile(
  playerName
) {

  const profile =
    document.getElementById(
      "profile"
    );

  const profileName =
    document.getElementById(
      "profileName"
    );

  const body =
    document.getElementById(
      "profileBody"
    );


  profileName.textContent =
    playerName;

  body.innerHTML = "";


  tierData.kits.forEach(
    kit => {

      const card =
        document.createElement(
          "div"
        );

      card.className =
        "kit-card";


      const name =
        document.createElement(
          "span"
        );

      name.textContent =
        kit.name;


      const rank =
        document.createElement(
          "span"
        );

      const playerRank =
        (
          tierData.data[kit.id] ||
          {}
        )[playerName];


      if (playerRank) {

        rank.textContent =
          playerRank;

      } else {

        rank.textContent =
          "Unranked";

        rank.className =
          "rank unranked";

      }


      card.appendChild(
        name
      );

      card.appendChild(
        rank
      );

      body.appendChild(
        card
      );

    }
  );


  profile.classList.add(
    "active"
  );


  profile.scrollIntoView({
    behavior: "smooth"
  });

}


/* =========================================
   CLOSE PROFILE
========================================= */

function closeProfile() {

  document
    .getElementById(
      "profile"
    )
    .classList.remove(
      "active"
    );

}


/* =========================================
   EVENTS
========================================= */

document
  .getElementById("search")
  .addEventListener(
    "input",
    renderTierList
  );


document
  .getElementById("kitSelect")
  .addEventListener(
    "change",
    renderTierList
  );


/* =========================================
   START
========================================= */

loadData();


/* =========================================
   AUTO UPDATE
========================================= */

setInterval(
  loadData,
  10000
);

</script>

</body>
</html>
