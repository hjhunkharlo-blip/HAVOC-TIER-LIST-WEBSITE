<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAVOC STYX — FFA Tier List</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #07090d;
  color: #fff;
  font-family: Arial, Helvetica, sans-serif;
}

header {
  padding: 36px 20px;
  text-align: center;
  background: linear-gradient(135deg, #111722, #080a0f);
  border-bottom: 1px solid #293140;
}

.logo {
  font-size: 32px;
  font-weight: 900;
  letter-spacing: 2px;
}

.subtitle {
  margin-top: 8px;
  color: #8993a5;
  font-size: 13px;
}

.container {
  width: 100%;
  max-width: 1050px;
  margin: auto;
  padding: 22px;
}

.controls {
  display: grid;
  grid-template-columns: 1fr 240px;
  gap: 12px;
  margin-bottom: 24px;
}

input,
select {
  width: 100%;
  padding: 15px;
  border: 1px solid #293241;
  border-radius: 11px;
  background: #11151d;
  color: #fff;
  font-size: 16px;
  outline: none;
}

input:focus,
select:focus {
  border-color: #6875ff;
}

.section-title {
  margin-bottom: 12px;
  color: #8993a5;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 1px;
}

.tier {
  display: grid;
  grid-template-columns: 80px 1fr;
  margin-bottom: 8px;
  overflow: hidden;
  background: #11151d;
  border: 1px solid #252d3a;
  border-radius: 11px;
}

.tier-name {
  display: flex;
  align-items: center;
  justify-content: center;
  background: #181e28;
  font-size: 17px;
  font-weight: 900;
}

.players {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  min-height: 55px;
  padding: 12px;
}

.player {
  padding: 9px 13px;
  background: #1b222d;
  border: 1px solid #303a4b;
  border-radius: 8px;
  color: white;
  font-weight: 700;
  cursor: pointer;
  transition: .15s;
}

.player:hover {
  background: #2b3546;
  transform: translateY(-1px);
}

.empty {
  padding: 8px;
  color: #687385;
}

/* PROFILE */

.profile {
  display: none;
  margin-top: 25px;
  overflow: hidden;
  background: #0d1118;
  border: 1px solid #2b3545;
  border-radius: 17px;
}

.profile.active {
  display: block;
}

.profile-banner {
  padding: 28px 22px;
  background: linear-gradient(135deg, #171f2e, #0d1118);
  border-bottom: 1px solid #293241;
}

.profile-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
}

.profile-name {
  font-size: 29px;
  font-weight: 900;
}

.profile-label {
  margin-top: 5px;
  color: #7f8999;
  font-size: 11px;
  letter-spacing: 1px;
}

.close {
  padding: 9px 14px;
  border: 1px solid #303a49;
  border-radius: 8px;
  background: #1a202b;
  color: white;
  cursor: pointer;
}

.profile-body {
  padding: 20px;
}

.kit-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}

.kit-card {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 15px;
  background: #141a23;
  border: 1px solid #283240;
  border-radius: 11px;
}

.kit-name {
  font-weight: 700;
}

.rank {
  padding: 6px 10px;
  background: #252f3e;
  border-radius: 7px;
  font-weight: 900;
}

.unranked {
  color: #6d7788;
}

.status {
  margin-top: 20px;
  text-align: center;
  color: #7e899a;
  font-size: 13px;
}

.error {
  color: #ff6d6d;
}

.loading {
  padding: 25px;
  text-align: center;
  color: #7e899a;
}

@media (max-width: 700px) {
  .controls {
    grid-template-columns: 1fr;
  }

  .kit-grid {
    grid-template-columns: 1fr;
  }

  .logo {
    font-size: 27px;
  }

  .profile-name {
    font-size: 24px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">HAVOC STYX</div>
  <div class="subtitle">FFA • OFFICIAL PLAYER TIER LIST</div>
</header>

<div class="container">

  <div class="controls">

    <input
      id="search"
      type="text"
      placeholder="Search player..."
      autocomplete="off"
    >

    <select id="kitSelect">
      <option value="">Connecting...</option>
    </select>

  </div>

  <div class="section-title">
    TIER LIST
  </div>

  <div id="tierList">
    <div class="loading">
      Loading HAVOC STYX...
    </div>
  </div>

  <div id="profile" class="profile">

    <div class="profile-banner">

      <div class="profile-header">

        <div>
          <div id="profileName" class="profile-name"></div>

          <div class="profile-label">
            HAVOC STYX PLAYER PROFILE
          </div>
        </div>

        <button
          class="close"
          onclick="closeProfile()"
        >
          Close
        </button>

      </div>

    </div>

    <div class="profile-body">
      <div id="kitGrid" class="kit-grid"></div>
    </div>

  </div>

  <div id="status" class="status">
    Connecting to HAVOC STYX...
  </div>

</div>

<script>

/* =====================================================
   RAILWAY API
===================================================== */

const API_URL =
  "https://havoc-bot-production-82b2.up.railway.app";


/* =====================================================
   TIERS
===================================================== */

const TIERS = [
  "HT1",
  "LT1",
  "HT2",
  "LT2",
  "HT3",
  "LT3",
  "HT4",
  "LT4",
  "HT5",
  "LT5"
];


let tierData = null;


/* =====================================================
   LOAD DATA
===================================================== */

async function loadData() {

  const status =
    document.getElementById("status");

  try {

    status.classList.remove("error");

    status.textContent =
      "Connecting to HAVOC STYX...";

    const response =
      await fetch(
        API_URL + "/api/tiers?t=" + Date.now(),
        {
          method: "GET",
          mode: "cors",
          cache: "no-store",
          headers: {
            "Accept": "application/json"
          }
        }
      );

    if (!response.ok) {

      throw new Error(
        "HTTP " + response.status
      );

    }

    const result =
      await response.json();

    console.log(
      "HAVOC STYX API:",
      result
    );

    if (
      !result ||
      !Array.isArray(result.kits) ||
      !result.data
    ) {

      throw new Error(
        "Invalid API response"
      );

    }

    tierData = result;

    createKitSelector();

    renderTierList();

    status.textContent =
      "🟢 Connected to HAVOC STYX";

  } catch (error) {

    console.error(
      "HAVOC STYX CONNECTION ERROR:",
      error
    );

    document.getElementById(
      "kitSelect"
    ).innerHTML =
      "<option>Connection failed</option>";

    document.getElementById(
      "tierList"
    ).innerHTML =
      '<div class="loading">Unable to load tier data.</div>';

    status.textContent =
      "🔴 API connection failed";

    status.classList.add("error");

  }

}


/* =====================================================
   CREATE KIT SELECTOR
===================================================== */

function createKitSelector() {

  const select =
    document.getElementById(
      "kitSelect"
    );

  select.innerHTML = "";

  tierData.kits.forEach(
    kit => {

      const option =
        document.createElement(
          "option"
        );

      option.value =
        kit.id;

      option.textContent =
        kit.name;

      select.appendChild(
        option
      );

    }
  );

}


/* =====================================================
   RENDER TIER LIST
===================================================== */

function renderTierList() {

  if (!tierData) {
    return;
  }

  const select =
    document.getElementById(
      "kitSelect"
    );

  const kit =
    select.value;

  const search =
    document.getElementById(
      "search"
    ).value
      .trim()
      .toLowerCase();

  const players =
    tierData.data[kit] || {};

  const container =
    document.getElementById(
      "tierList"
    );

  container.innerHTML = "";

  TIERS.forEach(
    tier => {

      const row =
        document.createElement(
          "div"
        );

      row.className =
        "tier";

      const tierName =
        document.createElement(
          "div"
        );

      tierName.className =
        "tier-name";

      tierName.textContent =
        tier;

      const playersBox =
        document.createElement(
          "div"
        );

      playersBox.className =
        "players";

      const names =
        Object.entries(players)
          .filter(
            ([player, rank]) =>
              rank === tier &&
              (
                !search ||
                player
                  .toLowerCase()
                  .includes(search)
              )
          )
          .map(
            ([player]) =>
              player
          );

      if (
        names.length === 0
      ) {

        const empty =
          document.createElement(
            "div"
          );

        empty.className =
          "empty";

        empty.textContent =
          "No players";

        playersBox.appendChild(
          empty
        );

      } else {

        names.forEach(
          playerName => {

            const player =
              document.createElement(
                "div"
              );

            player.className =
              "player";

            player.textContent =
              playerName;

            player.onclick =
              function() {
                showProfile(
                  playerName
                );
              };

            playersBox.appendChild(
              player
            );

          }
        );

      }

      row.appendChild(
        tierName
      );

      row.appendChild(
        playersBox
      );

      container.appendChild(
        row
      );

    }
  );

}


/* =====================================================
   SHOW PLAYER PROFILE
===================================================== */

function showProfile(
  playerName
) {

  if (!tierData) {
    return;
  }

  const profile =
    document.getElementById(
      "profile"
    );

  const profileName =
    document.getElementById(
      "profileName"
    );

  const grid =
    document.getElementById(
      "kitGrid"
    );

  profileName.textContent =
    playerName;

  grid.innerHTML = "";

  tierData.kits.forEach(
    kit => {

      const card =
        document.createElement(
          "div"
        );

      card.className =
        "kit-card";

      const kitName =
        document.createElement(
          "div"
        );

      kitName.className =
        "kit-name";

      kitName.textContent =
        kit.name;

      const rank =
        document.createElement(
          "div"
        );

      rank.className =
        "rank";

      const playerRank =
        tierData.data[kit.id]
          ? tierData.data[kit.id][playerName]
          : null;

      if (playerRank) {

        rank.textContent =
          playerRank;

      } else {

        rank.textContent =
          "Unranked";

        rank.classList.add(
          "unranked"
        );

      }

      card.appendChild(
        kitName
      );

      card.appendChild(
        rank
      );

      grid.appendChild(
        card
      );

    }
  );

  profile.classList.add(
    "active"
  );

  profile.scrollIntoView({
    behavior: "smooth",
    block: "start"
  });

}


/* =====================================================
   CLOSE PROFILE
===================================================== */

function closeProfile() {

  document
    .getElementById(
      "profile"
    )
    .classList.remove(
      "active"
    );

}


/* =====================================================
   SEARCH
===================================================== */

document
  .getElementById("search")
  .addEventListener(
    "input",
    renderTierList
  );


/* =====================================================
   KIT SELECT
===================================================== */

document
  .getElementById("kitSelect")
  .addEventListener(
    "change",
    renderTierList
  );


/* =====================================================
   INITIAL LOAD
===================================================== */

loadData();


/* =====================================================
   AUTO UPDATE
===================================================== */

setInterval(
  loadData,
  10000
);

</script>

</body>
</html>
