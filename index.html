<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>HAVOC STYX — FFA Tier List</title>

  <style>
    :root {
      --bg: #060608;
      --panel: #0d0d11;
      --panel-2: #121218;
      --panel-3: #18181f;
      --border: #292932;
      --text: #f5f5f7;
      --muted: #8c8c98;
      --accent: #e11d2e;
      --accent-dark: #8f0f1b;
      --success: #4ade80;
      --warning: #facc15;
      --danger: #ff4d5e;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 50% -10%, rgba(225, 29, 46, 0.18), transparent 35%),
        linear-gradient(180deg, #08080b 0%, #050506 100%);
      color: var(--text);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,0.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.018) 1px, transparent 1px);
      background-size: 40px 40px;
      mask-image: linear-gradient(to bottom, black, transparent 80%);
    }

    /* HEADER */

    header {
      position: relative;
      overflow: hidden;
      padding: 48px 20px 42px;
      text-align: center;
      background:
        linear-gradient(180deg, rgba(225, 29, 46, 0.12), transparent),
        #09090c;
      border-bottom: 1px solid var(--border);
    }

    header::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -80px;
      width: 320px;
      height: 160px;
      transform: translateX(-50%);
      background: var(--accent);
      opacity: 0.08;
      filter: blur(50px);
    }

    .brand {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      padding: 7px 13px;
      border: 1px solid rgba(225, 29, 46, 0.35);
      border-radius: 999px;
      background: rgba(225, 29, 46, 0.08);
      color: #ff6673;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .brand-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px rgba(225, 29, 46, 0.8);
    }

    header h1 {
      position: relative;
      z-index: 1;
      margin: 0;
      font-size: clamp(30px, 7vw, 48px);
      font-weight: 900;
      letter-spacing: -1.5px;
      text-transform: uppercase;
    }

    header h1 span {
      color: var(--accent);
      text-shadow: 0 0 25px rgba(225, 29, 46, 0.25);
    }

    header p {
      position: relative;
      z-index: 1;
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    /* MAIN */

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 1050px;
      margin: auto;
      padding: 24px 18px 60px;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 250px;
      gap: 12px;
      margin-bottom: 18px;
    }

    input,
    select {
      width: 100%;
      height: 50px;
      padding: 0 15px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: rgba(13, 13, 17, 0.95);
      color: var(--text);
      font-size: 15px;
      outline: none;
      transition: 0.18s ease;
    }

    input::placeholder {
      color: #60606a;
    }

    input:focus,
    select:focus {
      border-color: rgba(225, 29, 46, 0.7);
      box-shadow: 0 0 0 3px rgba(225, 29, 46, 0.08);
    }

    /* TIER ROW */

    .tier {
      display: grid;
      grid-template-columns: 100px 1fr;
      margin-bottom: 9px;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: rgba(13, 13, 17, 0.94);
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.16);
    }

    .tier:hover {
      border-color: #363640;
    }

    .tier-name {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 74px;
      background:
        linear-gradient(135deg, rgba(225, 29, 46, 0.18), rgba(225, 29, 46, 0.025)),
        var(--panel-2);
      border-right: 1px solid var(--border);
      font-size: 17px;
      font-weight: 900;
      letter-spacing: 0.4px;
    }

    .points {
      margin-top: 5px;
      color: #747480;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .players {
      display: flex;
      flex-wrap: wrap;
      align-content: center;
      gap: 7px;
      min-height: 74px;
      padding: 11px;
    }

    .player {
      padding: 9px 11px;
      border: 1px solid #30303a;
      border-radius: 8px;
      background: #19191f;
      cursor: pointer;
      transition: 0.15s ease;
      font-size: 13px;
      font-weight: 700;
    }

    .player:hover {
      transform: translateY(-2px);
      border-color: rgba(225, 29, 46, 0.65);
      background: #211419;
      box-shadow: 0 5px 18px rgba(225, 29, 46, 0.08);
    }

    .player-points {
      margin-left: 5px;
      color: #73737e;
      font-size: 10px;
      font-weight: 600;
    }

    .empty {
      padding: 8px;
      color: #5f5f6a;
      font-size: 13px;
    }

    /* STATUS */

    #status {
      margin-top: 18px;
      padding: 10px 12px;
      text-align: center;
      color: #747480;
      font-size: 12px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: rgba(13, 13, 17, 0.75);
    }

    .connected {
      color: var(--success) !important;
    }

    .warning {
      color: var(--warning) !important;
    }

    .error {
      color: var(--danger) !important;
    }

    .updated {
      margin-top: 7px;
      text-align: center;
      color: #50505a;
      font-size: 10px;
    }

    /* PROFILE */

    .profile {
      display: none;
      margin-top: 22px;
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: 13px;
      background:
        linear-gradient(135deg, rgba(225, 29, 46, 0.055), transparent 45%),
        var(--panel);
    }

    .profile.active {
      display: block;
    }

    .profile-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 17px;
    }

    .profile-label {
      margin-bottom: 4px;
      color: #666672;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .profile-name {
      font-size: 26px;
      font-weight: 900;
    }

    .close-button {
      padding: 9px 13px;
      border: 1px solid #34343e;
      border-radius: 8px;
      background: #18181e;
      color: white;
      cursor: pointer;
      font-weight: 700;
    }

    .close-button:hover {
      border-color: var(--accent);
      color: #ff6673;
    }

    .summary {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 15px;
    }

    .summary-box {
      flex: 1;
      min-width: 140px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--panel-2);
    }

    .summary-label {
      color: #676773;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .summary-value {
      margin-top: 4px;
      font-size: 20px;
      font-weight: 900;
    }

    .rank-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 13px;
      margin-bottom: 7px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--panel-2);
    }

    .rank-card:hover {
      border-color: #373740;
    }

    .rank {
      display: inline-block;
      min-width: 45px;
      padding: 6px 9px;
      text-align: center;
      border-radius: 6px;
      background: #25252d;
      font-size: 12px;
      font-weight: 900;
    }

    .rank-points {
      margin-left: 6px;
      color: #777782;
      font-size: 11px;
    }

    .unranked {
      color: #666672;
      font-size: 12px;
    }

    /* FOOTER */

    .footer {
      margin-top: 35px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
      text-align: center;
      color: #4f4f59;
      font-size: 10px;
      letter-spacing: 0.7px;
      text-transform: uppercase;
    }

    /* MOBILE */

    @media (max-width: 700px) {
      header {
        padding: 38px 15px 34px;
      }

      .container {
        padding: 18px 12px 45px;
      }

      .controls {
        grid-template-columns: 1fr;
      }

      .tier {
        grid-template-columns: 72px 1fr;
      }

      .tier-name {
        font-size: 14px;
      }

      .players {
        padding: 9px;
      }

      .player {
        padding: 8px 9px;
        font-size: 12px;
      }

      .profile-header {
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="brand">
    <span class="brand-dot"></span>
    Official PvP Rankings
  </div>

  <h1>HAVOC <span>STYX</span></h1>

  <p>FFA Tier List • Player Rankings • Live API</p>
</header>

<div class="container">

  <div class="controls">
    <input
      id="search"
      type="text"
      placeholder="Search player..."
      autocomplete="off"
    >

    <select id="kitSelect">
      <option value="">Connecting...</option>
    </select>
  </div>

  <div id="tierList"></div>

  <div id="profile" class="profile">

    <div class="profile-header">

      <div>
        <div class="profile-label">Player Profile</div>
        <div id="profileName" class="profile-name"></div>
      </div>

      <button
        class="close-button"
        onclick="closeProfile()"
      >
        Close
      </button>

    </div>

    <div id="profileRanks"></div>

  </div>

  <div id="status">
    Connecting to HAVOC STYX API...
  </div>

  <div id="updated" class="updated"></div>

  <div class="footer">
    HAVOC STYX FFA • Live Tier Rankings
  </div>

</div>

<script>
  const API_URL =
    "https://havoc-bot-production-82b2.up.railway.app/api/tiers";

  const REFRESH_INTERVAL = 10000;

  const DEFAULT_POINTS = {
    HT1: 61,
    LT1: 52,
    HT2: 41,
    LT2: 30,
    HT3: 21,
    LT3: 14,
    HT4: 9,
    LT4: 6,
    HT5: 3,
    LT5: 1
  };

  let tierData = null;
  let lastGoodData = null;

  const searchInput =
    document.getElementById("search");

  const kitSelect =
    document.getElementById("kitSelect");

  const tierList =
    document.getElementById("tierList");

  const profile =
    document.getElementById("profile");

  const profileName =
    document.getElementById("profileName");

  const profileRanks =
    document.getElementById("profileRanks");

  const status =
    document.getElementById("status");

  const updated =
    document.getElementById("updated");

  function getPoints(tier) {
    if (
      tierData &&
      tierData.pointsByTier &&
      typeof tierData.pointsByTier[tier] === "number"
    ) {
      return tierData.pointsByTier[tier];
    }

    return DEFAULT_POINTS[tier] || 0;
  }

  async function loadTierData() {
    try {
      const response = await fetch(
        API_URL + "?t=" + Date.now(),
        {
          method: "GET",
          cache: "no-store",
          mode: "cors"
        }
      );

      if (!response.ok) {
        throw new Error(
          "HTTP " + response.status
        );
      }

      const result = await response.json();

      if (
        !result ||
        !Array.isArray(result.kits) ||
        !Array.isArray(result.tiers) ||
        !result.data ||
        typeof result.data !== "object"
      ) {
        throw new Error(
          "Invalid tier API response"
        );
      }

      tierData = result;
      lastGoodData = result;

      buildKitSelector();
      renderTierList();

      const openProfile =
        profile.dataset.player;

      if (openProfile) {
        showProfile(
          openProfile,
          false
        );
      }

      status.textContent =
        "● LIVE • Connected";

      status.className =
        "connected";

      updated.textContent =
        "Last updated: " +
        new Date().toLocaleTimeString();

    } catch (error) {
      console.error(
        "HAVOC STYX API:",
        error
      );

      if (lastGoodData) {
        tierData = lastGoodData;

        status.textContent =
          "● Temporary connection problem • Showing last data";

        status.className =
          "warning";

        renderTierList();

      } else {
        status.textContent =
          "● Unable to connect to HAVOC STYX API";

        status.className =
          "error";

        tierList.innerHTML = `
          <div class="empty">
            Unable to load tier data.
            <br><br>
            Please refresh the page.
          </div>
        `;
      }
    }
  }

  function buildKitSelector() {
    const previousKit =
      kitSelect.value;

    kitSelect.innerHTML = "";

    tierData.kits.forEach(kit => {
      const option =
        document.createElement("option");

      option.value = kit.id;
      option.textContent = kit.name;

      kitSelect.appendChild(option);
    });

    const exists =
      tierData.kits.some(
        kit => kit.id === previousKit
      );

    if (exists) {
      kitSelect.value =
        previousKit;
    } else if (
      tierData.kits.length > 0
    ) {
      kitSelect.value =
        tierData.kits[0].id;
    }
  }

  function renderTierList() {
    if (!tierData) {
      return;
    }

    tierList.innerHTML = "";

    const kitId =
      kitSelect.value;

    const players =
      tierData.data[kitId] || {};

    const search =
      searchInput.value
        .trim()
        .toLowerCase();

    tierData.tiers.forEach(tier => {
      const row =
        document.createElement("div");

      row.className = "tier";

      const tierName =
        document.createElement("div");

      tierName.className =
        "tier-name";

      tierName.innerHTML = `
        <div>${escapeHTML(tier)}</div>
        <div class="points">
          ${getPoints(tier)} pts
        </div>
      `;

      const playerContainer =
        document.createElement("div");

      playerContainer.className =
        "players";

      const matchingPlayers =
        Object.entries(players)
          .filter(([player, playerTier]) => {
            if (playerTier !== tier) {
              return false;
            }

            if (!search) {
              return true;
            }

            return player
              .toLowerCase()
              .includes(search);
          })
          .sort(([a], [b]) =>
            a.localeCompare(b)
          );

      if (
        matchingPlayers.length === 0
      ) {
        const empty =
          document.createElement("div");

        empty.className = "empty";
        empty.textContent =
          "No players";

        playerContainer.appendChild(
          empty
        );

      } else {
        matchingPlayers.forEach(
          ([player, playerTier]) => {
            const button =
              document.createElement("div");

            button.className =
              "player";

            button.innerHTML = `
              <span>
                ${escapeHTML(player)}
              </span>

              <span class="player-points">
                +${getPoints(playerTier)}
              </span>
            `;

            button.onclick = () =>
              showProfile(player);

            playerContainer.appendChild(
              button
            );
          }
        );
      }

      row.appendChild(tierName);
      row.appendChild(playerContainer);

      tierList.appendChild(row);
    });
  }

  function showProfile(
    player,
    scroll = true
  ) {
    if (!tierData) {
      return;
    }

    profile.dataset.player = player;
    profileName.textContent = player;
    profileRanks.innerHTML = "";

    let totalPoints = 0;
    let rankedKits = 0;

    const summary =
      document.createElement("div");

    summary.className = "summary";

    tierData.kits.forEach(kit => {
      const kitData =
        tierData.data[kit.id] || {};

      const rank =
        kitData[player];

      const card =
        document.createElement("div");

      card.className =
        "rank-card";

      const kitName =
        document.createElement("div");

      kitName.textContent =
        kit.name;

      const rankDisplay =
        document.createElement("div");

      if (rank) {
        const points =
          getPoints(rank);

        totalPoints += points;
        rankedKits++;

        rankDisplay.innerHTML = `
          <span class="rank">
            ${escapeHTML(rank)}
          </span>

          <span class="rank-points">
            ${points} pts
          </span>
        `;
      } else {
        rankDisplay.className =
          "unranked";

        rankDisplay.textContent =
          "Unranked";
      }

      card.appendChild(kitName);
      card.appendChild(rankDisplay);

      profileRanks.appendChild(card);
    });

    summary.innerHTML = `
      <div class="summary-box">
        <div class="summary-label">
          Total Points
        </div>
        <div class="summary-value">
          ${totalPoints}
        </div>
      </div>

      <div class="summary-box">
        <div class="summary-label">
          Ranked Kits
        </div>
        <div class="summary-value">
          ${rankedKits}/${tierData.kits.length}
        </div>
      </div>
    `;

    profileRanks.prepend(summary);

    profile.classList.add("active");

    if (scroll) {
      profile.scrollIntoView({
        behavior: "smooth",
        block: "start"
      });
    }
  }

  function closeProfile() {
    profile.classList.remove("active");
    delete profile.dataset.player;
  }

  searchInput.addEventListener(
    "input",
    renderTierList
  );

  kitSelect.addEventListener(
    "change",
    renderTierList
  );

  function escapeHTML(value) {
    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  loadTierData();

  setInterval(
    loadTierData,
    REFRESH_INTERVAL
  );
</script>

</body>
  </html>
